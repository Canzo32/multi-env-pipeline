AWSTemplateFormatVersion: "2010-09-09"
Description: Small scanner Lambda deployed per environment
Parameters:
  Environment:
    Type: String
    AllowedValues: [dev, prod]
Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub scanner-${Environment}-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/scanner-${Environment}-fn
      RetentionInDays: 7
  ScannerFunction:
    Type: AWS::Lambda::Function
    DependsOn: LogGroup
    Properties:
      FunctionName: !Sub scanner-${Environment}-fn
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt LambdaRole.Arn
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
      Code:
        ZipFile: |
          import os
          def handler(event, context):
              return {"env": os.environ["ENVIRONMENT"], "status": "ok"}
Outputs:
  FunctionName:
    Value: !Ref ScannerFunction
