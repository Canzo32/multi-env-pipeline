name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::617371012816:role/GitHubDeployDev
          aws-region: us-east-1
      - run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name scanner-prod \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::617371012816:role/GitHubDeployProd
          aws-region: us-east-1
      - run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name scanner-prod \
            --parameter-overrides Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM
