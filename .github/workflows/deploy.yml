name: deploy
on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Show OIDC claims
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          echo "$TOKEN" | python3 -c "import sys,base64,json; p=sys.stdin.read().split('.')[1]; p+='='*(-len(p)%4); d=json.loads(base64.urlsafe_b64decode(p)); print({k:d.get(k) for k in ('sub','aud','repository','iss')})"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::617371012816:role/GitHubDeployDev
          aws-region: us-east-1

      - run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name scanner-dev \
            --parameter-overrides Environment=dev \
            --capabilities CAPABILITY_NAMED_IAM

  deploy-prod:
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::617371012816:role/GitHubDeployProd
          aws-region: us-east-1
      - run: |
          aws cloudformation deploy \
            --template-file template.yaml \
            --stack-name scanner-prod \
            --parameter-overrides Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM
